<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Yaro's Practice Blog</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="stylesheet" href="blog.css">
</head>
<body>
  <nav class="topbar">
    <a href="../index.html">Home</a>
    <a href="index.html">Blog</a>
  </nav>

  <main class="wrap">
    <article class="post">
      <h1>{{TITLE}}</h1>
      <div class="meta">{{DATE}} · {{READ_TIME}} min read</div>

      <img class="cover" src="images/{{SLUG}}.jpg" alt="{{IMAGE_ALT}}">

      {{BODY}}

      <div class="cta">{{CALL_TO_ACTION}}</div>
    </article>
  </main>

  <footer>&copy; 2026 Yaro Maslov</footer>
</body>
</html>
